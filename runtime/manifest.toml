# Runtime sources for the bundled libmpv playback core.
#
# `scripts/fetch-runtime.ps1` downloads each archive, verifies it against the
# pinned `sha256`, and normalizes it into the `third_party/mpv/<platform>/`
# layout that `scripts/package.ps1` consumes. `version` + `sha256` pin the exact
# bytes, so a release cannot silently pick up a different build.
#
# `available = false` means no redistributable public build has been vetted for
# that platform yet. Those entries exist to document the requirement and to make
# `bootstrap-runtime.ps1 -DryRun` explain itself; the release workflow refuses to
# build a platform whose entry is not available.
#
# Licensing: mpv and the FFmpeg build below are GPL-2.0-or-later, which is why
# YoYoVideo itself is distributed under GPL-3.0-or-later. Redistribution requires
# shipping the corresponding source — see LICENSES.md.

[[runtime]]
platform = "windows-x64"
available = true
version = "shinchiro-mpv-winbuild-cmake-20261004"
source_url = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261004/mpv-dev-x86_64-20261004-git-413ff0b1cd.7z"
sha256 = "445fc72a8aa10980504355a5d99c9a0a128c2fa177e029996fb312d9d3193d45"
archive_format = "7z"
destination = "third_party/mpv/windows-x64"
required_files = ["lib/mpv.lib", "bin/mpv-2.dll"]
notes = "shinchiro/mpv-winbuild-cmake mpv-dev x86_64 build, with FFmpeg statically linked into a single libmpv-2.dll. The upstream archive ships a MinGW import library (libmpv.dll.a); fetch-runtime.ps1 renames the DLL to mpv-2.dll and regenerates an MSVC import library from that DLL's own exports, so the executable imports mpv-2.dll and finds it beside the binary."

[[runtime]]
platform = "macos-universal"
available = false
version = "unavailable"
source_url = "env:YOYOVIDEO_RUNTIME_ARCHIVE_MACOS_UNIVERSAL_URL"
sha256 = "env:YOYOVIDEO_RUNTIME_ARCHIVE_MACOS_UNIVERSAL_SHA256"
archive_format = "zip"
destination = "third_party/mpv/macos-universal"
required_files = ["lib/libmpv.dylib"]
notes = "No public universal libmpv dylib has been vetted yet: upstream Windows builds do not apply, and Homebrew ships per-architecture bottles only, so a single 'macos-universal' artifact would be a lie. Set available = true together with a real source_url and sha256 once a universal build is pinned. Native video embedding is also still unimplemented on macOS (see docs/development/runtime-dependencies.md), so the app there opens without a video surface."

[[runtime]]
platform = "linux-x64"
available = false
version = "unavailable"
source_url = "env:YOYOVIDEO_RUNTIME_ARCHIVE_LINUX_X64_URL"
sha256 = "env:YOYOVIDEO_RUNTIME_ARCHIVE_LINUX_X64_SHA256"
archive_format = "zip"
destination = "third_party/mpv/linux-x64"
required_files = ["lib/libmpv.so"]
notes = "No public libmpv build has been vetted yet. Distributing one also means bundling its whole FFmpeg/libplacebo dependency closure, which is why this is not simply a matter of copying a single .so. Set available = true together with a real source_url and sha256 once such a build is pinned."
