[package]
name = "yoyovideo-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
mpv-runtime = ["dep:i-slint-backend-winit", "dep:raw-window-handle", "yoyo-mpv/mpv-runtime"]

[dependencies]
chrono = "0.4.45"
directories = "6.0.0"
i-slint-backend-winit = { version = "1.17.0", optional = true }
raw-window-handle = { version = "0.6.2", optional = true }
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
slint = { version = "1.17.0", features = ["backend-winit", "unstable-winit-030", "raw-window-handle-06"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
toml = "1.1.2"
yoyo-core = { path = "../../crates/yoyo-core" }
yoyo-mpv = { path = "../../crates/yoyo-mpv" }

[build-dependencies]
slint-build = "1.17.0"

[dev-dependencies]
tempfile = "3.27.0"

# macOS video rendering: mpv's render API needs an OpenGL context the
# application owns, and on macOS that context is an NSOpenGLContext attached to
# the view. mpv has no --wid embedding on macOS at all -- its cocoa backend
# creates and owns its own NSWindow -- so this is the only supported path.
# Windows resources: the .exe icon, so the binary does not show up as a generic
# blank page in Explorer and the taskbar. Windows-only, and a build dependency
# because a resource has to be compiled into the binary before it links.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# `objc2-open-gl` is what gates NSOpenGLContext's ``initWithFormat:shareContext:``
# and NSOpenGLPixelFormat's ``initWithAttributes:``; without it the only
# constructors in scope are the deprecated CGL ones. NSResponder is required by
# ``setView:``.
objc2-app-kit = { version = "0.3", features = ["NSOpenGL", "NSView", "NSResponder", "NSWindow", "objc2-open-gl"] }
objc2-foundation = { version = "0.3", features = ["NSThread"] }
