[package]
name = "yoyo-updater"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
minisign-verify = "=0.3.0"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
velopack = { version = "=1.2.161", features = ["public-utils"] }
ureq = "=3.4.2"
toml = "1.1.2"
tempfile = "3"

[dev-dependencies]
minisign = "=0.10.0"
