name: Windows native updater regression
on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
permissions:
  contents: read
jobs:
  windows-upgrade:
    name: Real Windows portable-layout upgrade
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SLINT_RENDERER: software
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Prepare isolated QA build tools and playback runtime
        shell: pwsh
        run: |
          if (-not (Get-Command 7z.exe -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path 'C:/Program Files/7-Zip/7z.exe')) { throw '7-Zip is required on the runner' }
            $env:PATH = "C:/Program Files/7-Zip;$env:PATH"
          }
          dotnet tool install vpk --version 1.2.161 --tool-path .cache/tools/vpk
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/fetch-runtime.ps1 -Platform windows-x64 -Force
      - name: Exercise actual 0.0.1 to 0.0.2 replacement, restart and preserved state
        shell: pwsh
        # Disposable local keys only; never production secrets or a public release.
        run: pwsh -NoProfile -File scripts/test-velopack-upgrade.ps1 -Platform windows-x64 -FromVersion 0.0.1 -ToVersion 0.0.2
      - name: Retain event evidence (not keys or QA packages)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-upgrade-diagnostics
          if-no-files-found: warn
          path: |
            .cache/updater-upgrade-build-*/run-*/events.jsonl
            .cache/updater-upgrade-build-*/run-*/SUCCESS.json
            .cache/updater-upgrade-build-*/run-*/*.log
