name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "docs/assets/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs-site/**"
      - "docs/assets/**"
      - ".github/workflows/docs.yml"
  # release.yml dispatches this by hand, because GitHub does not start workflow
  # runs from events its own GITHUB_TOKEN created.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose download links should be highlighted"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: docs-site

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # lastUpdated reads git history for each page.
          fetch-depth: 0

      # Must precede setup-node so its pnpm cache resolution can find pnpm.
      # Version comes from docs-site/package.json packageManager.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build
        run: pnpm docs:build

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          # Relative to the repository root, not the job working-directory.
          path: docs-site/docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
