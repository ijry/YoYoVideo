name: CI

on:
  push:
  pull_request:

jobs:
  fmt-test:
    name: Format and default tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build and test dependencies
        # Slint's Linux text backend resolves fontconfig through
        # yeslogic-fontconfig-sys, whose build script shells out to pkg-config.
        # Without the -dev package the build fails before any test runs. xvfb
        # supplies the virtual display that the window-construction tests need:
        # MainWindow::new() initializes a real winit backend, which refuses to
        # start when neither DISPLAY nor WAYLAND_DISPLAY is set.
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev xvfb
          # winit's X11 backend dlopens these at runtime; the build succeeds without
          # them and only the window-construction tests notice.
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-shape0 libxcb-xfixes0 libxcb-render0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test release gates and packaging contracts (no private keys)
        run: |
          node --test scripts/test-updater-release.mjs
          pwsh -NoProfile -File scripts/test-velopack-package.ps1 -SkipNativeProbe
          pwsh -NoProfile -File scripts/test-appimage-runtime.ps1

      - name: Check formatting
        run: cargo fmt --check

      - name: Run default tests
        run: xvfb-run -a cargo test

  runtime-check:
    name: Runtime feature check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libmpv-dev provides the playback core; pkg-config and libfontconfig1-dev
          # are needed by Slint's Linux text backend.
          sudo apt-get install -y libmpv-dev pkg-config libfontconfig1-dev libxkbcommon-dev

      - name: Install macOS mpv package
        if: runner.os == 'macOS'
        run: brew install mpv

      - name: Document Windows runtime-link expectation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "cargo check does not produce a final linked executable."
          Write-Host "Runtime packaging still requires third_party/mpv/windows-x64/lib/mpv.lib and bin/mpv-2.dll."

      - name: Check yoyo-mpv runtime feature
        run: cargo check -p yoyo-mpv --features mpv-runtime

      - name: Check desktop runtime feature
        run: cargo check -p yoyovideo-desktop --features mpv-runtime
  # The release workflow stages the playback core on a tag. Running the same
  # staging on every push means a broken package-manager layout or a rewritten
  # install name fails on a pull request instead of at release time.
  runtime-stage:
    name: Stage runtime (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            platform: macos-aarch64
            os: macos-14
          - label: macOS (Intel)
            platform: macos-x86_64
            os: macos-15-intel
          - label: Linux x64
            platform: linux-x64
            os: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS playback runtime
        if: startsWith(matrix.platform, 'macos')
        run: brew install mpv

      - name: Install Linux playback runtime
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev pkg-config libfontconfig1-dev

      - name: Stage runtime
        shell: pwsh
        run: pwsh -NoProfile -File scripts/fetch-runtime.ps1 -Platform ${{ matrix.platform }} -Force

      - name: Assert the staged runtime is complete
        shell: pwsh
        run: |
          $platform = "${{ matrix.platform }}"
          $stage = "third_party/mpv/$platform"
          $libs = @(Get-ChildItem "$stage/lib" -File)
          Write-Host "Staged $($libs.Count) file(s) under $stage/lib"

          $recordPath = Join-Path $stage "runtime-source.json"
          if (-not (Test-Path -LiteralPath $recordPath)) {
            throw "Missing $recordPath"
          }
          $record = Get-Content -Raw -LiteralPath $recordPath | ConvertFrom-Json
          Write-Host ($record | ConvertTo-Json -Depth 4)

          if ($platform -eq "linux-x64") {
              # Linux declares its libraries; there is nothing to bundle and the
              # declaration must name libmpv or the .deb is uninstallable.
              $depends = @($record.depends)
              if ($depends.Count -lt 2) {
                throw "Linux runtime declared only $($depends.Count) dependency package(s)"
              }
              if (-not ($depends -contains $record.package) -or $record.package -notin @("libmpv1", "libmpv2")) {
                throw "Linux runtime does not declare its libmpv package: $($depends -join ', ')"
              }
              if ($libs | Where-Object { $_.Name -match '^lib(avcodec|avformat|avutil|c)\.' }) {
                throw "The Linux staging is bundling FFmpeg copies; those belong in dependencies."
              }
              Write-Host "Declared dependencies: $($depends -join ', ')"
              exit 0
          }

          # macOS bundles, because a .app is expected to be self-contained. So the
          # closure has to actually be there, and no install name may still point
          # at the build host's Homebrew prefix -- that works on the runner and
          # breaks the moment the package moves.
          if ($libs.Count -lt 2) {
            throw "macOS staging holds $($libs.Count) file(s); a loadable runtime needs the library plus its dependency closure."
          }
          $libs | ForEach-Object { "{0,10}  {1}" -f $_.Length, $_.Name }

          foreach ($lib in $libs) {
              $paths = & otool -l $lib.FullName | Select-String '/opt/homebrew|/usr/local/Cellar|/usr/local/opt'
              if ($paths) {
                  $paths | ForEach-Object { Write-Host "::error file=$($lib.Name)::$($_.Line.Trim())" }
                  throw "Install names in $($lib.Name) still reference the build host's Homebrew prefix."
              }
          }
          Write-Host "All macOS install names are relative."