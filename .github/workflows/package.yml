name: Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package-windows:
    name: Package Windows x64
    runs-on: windows-latest
    env:
      YOYOVIDEO_RUNTIME_ARCHIVE_WINDOWS_X64_URL: ${{ secrets.YOYOVIDEO_RUNTIME_ARCHIVE_WINDOWS_X64_URL }}
      YOYOVIDEO_RUNTIME_ARCHIVE_WINDOWS_X64_SHA256: ${{ secrets.YOYOVIDEO_RUNTIME_ARCHIVE_WINDOWS_X64_SHA256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate runtime manifest
        shell: pwsh
        run: pwsh -NoProfile -File scripts/bootstrap-runtime.ps1 -Platform windows-x64 -DryRun

      - name: Bootstrap runtime
        shell: pwsh
        run: pwsh -NoProfile -File scripts/bootstrap-runtime.ps1 -Platform windows-x64 -Force

      - name: Build package
        shell: pwsh
        run: pwsh -NoProfile -File scripts/package.ps1 -Platform windows-x64 -Configuration release -RequireRuntime -ReleaseMode -ReleaseVersion $env:GITHUB_REF_NAME

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y

      - name: Build installer
        shell: pwsh
        run: pwsh -NoProfile -File scripts/build-installer.ps1 -PackageDir dist/YoYoVideo-windows-x64 -OutputPath dist/YoYoVideo-windows-x64-setup.exe -Version $env:GITHUB_REF_NAME

      - name: Upload package archive
        uses: actions/upload-artifact@v7
        with:
          name: YoYoVideo-windows-x64
          path: dist/YoYoVideo-windows-x64.zip
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: YoYoVideo-windows-x64-setup
          path: dist/YoYoVideo-windows-x64-setup.exe
          if-no-files-found: error

  package-macos:
    name: Package macOS universal
    runs-on: macos-latest
    env:
      YOYOVIDEO_RUNTIME_ARCHIVE_MACOS_UNIVERSAL_URL: ${{ secrets.YOYOVIDEO_RUNTIME_ARCHIVE_MACOS_UNIVERSAL_URL }}
      YOYOVIDEO_RUNTIME_ARCHIVE_MACOS_UNIVERSAL_SHA256: ${{ secrets.YOYOVIDEO_RUNTIME_ARCHIVE_MACOS_UNIVERSAL_SHA256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate runtime manifest
        shell: pwsh
        run: pwsh -NoProfile -File scripts/bootstrap-runtime.ps1 -Platform macos-universal -DryRun

      - name: Bootstrap runtime
        shell: pwsh
        run: pwsh -NoProfile -File scripts/bootstrap-runtime.ps1 -Platform macos-universal -Force

      - name: Build package
        shell: pwsh
        run: pwsh -NoProfile -File scripts/package.ps1 -Platform macos-universal -Configuration release -RequireRuntime -ReleaseMode -ReleaseVersion $env:GITHUB_REF_NAME

      - name: Upload package archive
        uses: actions/upload-artifact@v7
        with:
          name: YoYoVideo-macos-universal
          path: dist/YoYoVideo-macos-universal.tar.gz
          if-no-files-found: error

  package-linux:
    name: Package Linux x64
    runs-on: ubuntu-latest
    env:
      YOYOVIDEO_RUNTIME_ARCHIVE_LINUX_X64_URL: ${{ secrets.YOYOVIDEO_RUNTIME_ARCHIVE_LINUX_X64_URL }}
      YOYOVIDEO_RUNTIME_ARCHIVE_LINUX_X64_SHA256: ${{ secrets.YOYOVIDEO_RUNTIME_ARCHIVE_LINUX_X64_SHA256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate runtime manifest
        shell: pwsh
        run: pwsh -NoProfile -File scripts/bootstrap-runtime.ps1 -Platform linux-x64 -DryRun

      - name: Bootstrap runtime
        shell: pwsh
        run: pwsh -NoProfile -File scripts/bootstrap-runtime.ps1 -Platform linux-x64 -Force

      - name: Build package
        shell: pwsh
        run: pwsh -NoProfile -File scripts/package.ps1 -Platform linux-x64 -Configuration release -RequireRuntime -ReleaseMode -ReleaseVersion $env:GITHUB_REF_NAME

      - name: Upload package archive
        uses: actions/upload-artifact@v7
        with:
          name: YoYoVideo-linux-x64
          path: dist/YoYoVideo-linux-x64.tar.gz
          if-no-files-found: error
