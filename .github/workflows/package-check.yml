name: Package check

# Runs the full release chain -- stage runtime, build the package, decode real
# media with the packaged core -- without cutting a tag or publishing anything.
#
# The release workflow does exactly this, but it is only reachable by tagging, and
# a packaging regression should be discoverable before it costs a release. Only
# dispatchable on purpose: it builds every platform in release mode, which is far
# too expensive to run on every push.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to check (blank = all)"
        required: false
        type: choice
        options:
          - all
          - windows-x64
          - macos-aarch64
          - macos-x86_64
          - linux-x64

jobs:
  check:
    name: Package ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            platform: windows-x64
            os: windows-latest
          - label: macOS (Apple Silicon)
            platform: macos-aarch64
            os: macos-14
          - label: macOS (Intel)
            platform: macos-x86_64
            os: macos-15-intel
          - label: Linux x64
            platform: linux-x64
            os: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Skip unselected platforms
        if: inputs.platform != '' && inputs.platform != 'all' && inputs.platform != matrix.platform
        run: exit 78

      - name: Install macOS playback runtime
        if: startsWith(matrix.platform, 'macos')
        run: brew install mpv

      - name: Install Linux dependencies
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev pkg-config libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-shape0 libxcb-xfixes0 libxcb-render0

      - name: Install 7-Zip
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          if (-not (Get-Command 7z.exe -ErrorAction SilentlyContinue)) {
            choco install 7zip --yes --no-progress
            "C:\Program Files\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Stage runtime
        shell: pwsh
        run: pwsh -NoProfile -File scripts/fetch-runtime.ps1 -Platform ${{ matrix.platform }} -Force

      - name: Build package
        shell: pwsh
        run: pwsh -NoProfile -File scripts/package.ps1 -Platform ${{ matrix.platform }} -Configuration release -RequireRuntime -ReleaseMode -ReleaseVersion 0.0.0-check

      - name: Decode real media with the packaged core
        shell: pwsh
        run: pwsh -NoProfile -File scripts/smoke-package.ps1 -Platform ${{ matrix.platform }} -PackageDir dist/YoYoVideo-${{ matrix.platform }} -RequireRuntime -SkipLaunch -TimeoutSeconds 90

      - name: Build NSIS installer
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          $nsisDir = "C:\Program Files (x86)\NSIS"
          if (Test-Path -LiteralPath (Join-Path $nsisDir "makensis.exe")) { $env:PATH = "$nsisDir;$env:PATH" }
          pwsh -NoProfile -File scripts/build-installer.ps1 `
            -PackageDir dist/YoYoVideo-${{ matrix.platform }} `
            -OutputPath dist/YoYoVideo-${{ matrix.platform }}-setup.exe `
            -Version 0.0.0-check

      - name: List the produced artifacts
        shell: pwsh
        run: |
          Get-ChildItem dist -File -Include *.zip, *.tar.gz, *.deb, *.exe -Recurse |
            ForEach-Object { "{0,12:N0}  {1}" -f $_.Length, $_.Name }
          if ("${{ matrix.platform }}" -eq "linux-x64") {
            dpkg-deb --info dist/YoYoVideo-linux-x64.deb
            dpkg-deb --contents dist/YoYoVideo-linux-x64.deb
          }