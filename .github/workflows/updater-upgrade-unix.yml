name: Unix native updater regression
on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
permissions:
  contents: read
jobs:
  upgrade:
    name: Upgrade ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-aarch64, os: macos-14 }
          - { platform: macos-x86_64, os: macos-15-intel }
          - { platform: linux-x64, os: ubuntu-22.04 }
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Verify clean Linux container tools before building the app
        if: runner.os == 'Linux'
        run: bash scripts/qa-linux/build-containers.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install macOS runtime
        if: runner.os == 'macOS'
        run: brew install mpv
      - name: Install Ubuntu 22.04 build/runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev libxkbcommon-x11-0 libxcb-shape0 libxcb-xfixes0 libxcb-render0 libxcursor1 libxrandr2 libxi6 libfuse2 patchelf squashfs-tools desktop-file-utils file xvfb xauth
      - name: Install pinned vpk and stage runtime
        shell: pwsh
        run: |
          dotnet tool install vpk --version 1.2.161 --tool-path .cache/tools/vpk
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/fetch-runtime.ps1 -Platform ${{ matrix.platform }} -Force
      - name: Build real signed test versions without production keys
        id: fixture
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/test-velopack-upgrade.ps1 -Platform ${{ matrix.platform }} -BuildOnly
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $roots = @(Get-ChildItem .cache -Directory -Filter 'updater-upgrade-build-*')
          if ($roots.Count -ne 1) { throw 'Ambiguous QA build root' }
          "root=$($roots[0].FullName)" >> $env:GITHUB_OUTPUT
          "relative=.cache/$($roots[0].Name)" >> $env:GITHUB_OUTPUT
      - name: Exercise native macOS update and preserved state
        if: runner.os == 'macOS'
        shell: pwsh
        env:
          QA_BUILD_ROOT: ${{ steps.fixture.outputs.root }}
        run: pwsh -NoProfile -File scripts/test-velopack-upgrade.ps1 -Platform ${{ matrix.platform }} -BuildRoot $env:QA_BUILD_ROOT
      - name: Exercise AppImage in clean 22.04 and 24.04 containers, with FUSE and extraction
        if: runner.os == 'Linux'
        env:
          QA_BUILD_ROOT: ${{ steps.fixture.outputs.relative }}
        run: |
          set -euo pipefail
          for version in 22.04 24.04; do
            for mode in extract fuse; do
              echo "Running Ubuntu $version / $mode"
              timeout 900s docker run --init --rm --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined -v "$GITHUB_WORKSPACE:/workspace" "yoyo-qa:$version" -BuildRoot "/workspace/$QA_BUILD_ROOT" -LinuxMode "$mode"
            done
          done
      - name: Retain evidence, never test keys or packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-${{ matrix.platform }}-diagnostics
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .cache/updater-upgrade-build-*/run-*/events.jsonl
            .cache/updater-upgrade-build-*/run-*/SUCCESS.json
            .cache/updater-upgrade-build-*/run-*/*.log
