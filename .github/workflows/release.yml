name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable tag to publish (existing releases are refused)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    name: Validate immutable release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Depth-1 tag checkout binds the local tag ref to the peeled commit.
          # Preserve the annotated object; validation must not force-fetch a changed tag.
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve annotated tag, version and exact commit
        id: tag
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Expected stable vX.Y.Z'; exit 1; }
          git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          git checkout --detach "$TAG"
          commit="$(git rev-parse HEAD)"
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          [[ "v$version" == "$TAG" ]] || { echo 'Tag/workspace version mismatch'; exit 1; }
          [[ "$(git cat-file -t "refs/tags/$TAG")" == tag ]] || { echo 'Release notes require an annotated tag'; exit 1; }
          git for-each-ref --format='%(contents)' "refs/tags/$TAG" > release-notes.md
          grep -q '[^[:space:]]' release-notes.md
          printf 'tag=%s\nversion=%s\ncommit=%s\n' "$TAG" "$version" "$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
  build:
    needs: prepare
    uses: ./.github/workflows/updater-build.yml
    with:
      revision: ${{ needs.prepare.outputs.commit }}
      version: ${{ needs.prepare.outputs.version }}
      require-public-key-variable: true
  windows-upgrade:
    needs: prepare
    uses: ./.github/workflows/updater-upgrade-windows.yml
    with:
      revision: ${{ needs.prepare.outputs.commit }}
  unix-upgrade:
    needs: prepare
    uses: ./.github/workflows/updater-upgrade-unix.yml
    with:
      revision: ${{ needs.prepare.outputs.commit }}
  publish:
    name: Sign, verify draft and publish
    needs: [prepare, build, windows-upgrade, unix-upgrade]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare signing public key with client pin
        shell: pwsh
        env:
          YOYOVIDEO_UPDATER_PUBLIC_KEY: ${{ vars.YOYOVIDEO_UPDATER_PUBLIC_KEY }}
        run: |
          $pinned = (Get-Content -Raw apps/yoyovideo-desktop/assets/updater.pub).Trim()
          if (-not $env:YOYOVIDEO_UPDATER_PUBLIC_KEY -or $env:YOYOVIDEO_UPDATER_PUBLIC_KEY.Trim() -cne $pinned) { throw 'Public key mismatch' }
      - name: Build trusted signing tool without signing credentials
        run: cargo build --locked --release -p yoyo-update-sign
      - uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: .cache/release-input
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Merge without overwriting and verify unsigned packages
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          . ./scripts/velopack-common.ps1
          $platforms = @('windows-x64','macos-aarch64','macos-x86_64','linux-x64')
          $dirs = @(Get-ChildItem .cache/release-input -Force)
          if ($dirs.Count -ne 4) { throw 'Expected four native artifacts' }
          New-Item -ItemType Directory -Path release-assets | Out-Null
          foreach ($platform in $platforms) {
            $dir = Get-Item -LiteralPath ".cache/release-input/updater-$platform"
            if (-not $dir.PSIsContainer -or $dir.LinkType) { throw 'Invalid artifact directory' }
            foreach ($file in Get-ChildItem -LiteralPath $dir.FullName -Force) {
              Assert-VelopackAssetName $file.Name
              if ($file.PSIsContainer -or $file.LinkType -or (Test-Path -LiteralPath (Join-Path release-assets $file.Name))) { throw 'Nested, linked or colliding artifact' }
              Copy-Item -LiteralPath $file.FullName -Destination release-assets/
            }
            & ./scripts/verify-velopack-package.ps1 -ReleaseDir release-assets -Platform $platform -Version $env:RELEASE_VERSION -BeforeSigning
          }
      - name: Sign all four manifests (credentials only in this step)
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          YOYOVIDEO_UPDATER_PRIVATE_KEY: ${{ secrets.YOYOVIDEO_UPDATER_PRIVATE_KEY }}
          YOYOVIDEO_UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.YOYOVIDEO_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: |
          . ./scripts/velopack-common.ps1
          foreach ($platform in @('windows-x64','macos-aarch64','macos-x86_64','linux-x64')) {
            Invoke-VelopackTool -FilePath ./target/release/yoyo-update-sign -Arguments @('sign','--feed',"release-assets/releases.stable-$platform.json",'--platform',$platform,'--version',$env:RELEASE_VERSION,'--assets-dir','release-assets','--output',"release-assets/yoyovideo-update.$platform.json",'--public-key','apps/yoyovideo-desktop/assets/updater.pub') -Signing | Out-Host
          }
      - name: Verify complete authenticated release and generate download table
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          node scripts/verify-updater-release.mjs verify --assets-dir release-assets --version "$RELEASE_VERSION" --signer target/release/yoyo-update-sign --public-key apps/yoyovideo-desktop/assets/updater.pub
          node scripts/create-release-body.mjs --assets-dir release-assets --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --output release-body.md --notes-file release-notes.md
      - name: Upload draft, download and reverify, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          node scripts/verify-updater-release.mjs publish --assets-dir release-assets --version "$RELEASE_VERSION" --signer target/release/yoyo-update-sign --public-key apps/yoyovideo-desktop/assets/updater.pub --repo "$GITHUB_REPOSITORY" --commit "$RELEASE_COMMIT" --notes-file release-body.md
      - name: Notify docs site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main || echo '::warning::Dispatch docs.yml manually if the site is stale.'
