name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.0.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      release_notes: ${{ steps.notes.outputs.body }}
      platforms: ${{ steps.platforms.outputs.list }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # A release is only ever made from the commit the tag points at, so a tag
      # that sits on a stale branch cannot publish artifacts built from other code.
      - name: Resolve tag and workspace version
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          if [[ "$IS_DISPATCH" == "true" ]]; then
            tag="${INPUT_TAG#v}"
            git fetch --depth 1 origin "refs/tags/v$tag:refs/tags/v$tag"
            git checkout --detach "v$tag"
            echo "tag=v$tag" >> "$GITHUB_OUTPUT"
          else
            git fetch --force --tags
            tag="${GITHUB_REF_NAME#v}"
            git checkout --detach "$GITHUB_REF_NAME"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)(\.[0-9]+)?)?$ ]]; then
            echo "Unsupported release version: $tag" >&2
            exit 1
          fi

          # Cargo.toml owns the version, so the tag cannot drift away from the code.
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [[ "$version" != "$tag" ]]; then
            echo "Workspace version ${version} does not match tag v${tag}." >&2
            echo "Update [workspace.package] version in Cargo.toml, or retag." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: v$version"

      - name: Collect release notes from the tag commit
        id: notes
        shell: bash
        run: |
          # The tag commit's message is the changelog. GitHub's generated notes for
          # a release tag are only a compare link, which is not a changelog.
          git log -1 --format=%B "$GITHUB_SHA" > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "Tag commit ${GITHUB_SHA} has an empty message; release notes would be blank." >&2
            exit 1
          fi
          delimiter="release-notes-$(openssl rand -hex 8)"
          {
            echo "body<<${delimiter}"
            cat release-notes.md
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      # Publishing a platform whose runtime is not pinned would ship a package that
      # launches without playback. Fail here rather than in the middle of a matrix.
      - name: Resolve shippable platforms
        id: platforms
        shell: bash
        run: |
          set -euo pipefail
          platforms="windows-x64"
          echo "Building: $platforms"
          for skipped in macos-universal linux-x64; do
            echo "::notice::$skipped is not built for this release: its runtime/manifest.toml entry has available = false."
          done
          echo "list=$platforms" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }}
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            platform: windows-x64
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install 7-Zip
        # The pinned runtime archive is a .7z; GitHub's Windows image ships 7z but
        # not on PATH by default for pwsh.
        shell: pwsh
        run: |
          if (-not (Get-Command 7z.exe -ErrorAction SilentlyContinue)) {
            choco install 7zip --yes --no-progress
            "C:\Program Files\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Validate runtime manifest
        shell: pwsh
        run: pwsh -NoProfile -File scripts/fetch-runtime.ps1 -Platform ${{ matrix.platform }} -DryRun

      - name: Stage runtime
        shell: pwsh
        run: pwsh -NoProfile -File scripts/fetch-runtime.ps1 -Platform ${{ matrix.platform }} -Force

      - name: Build package
        shell: pwsh
        run: pwsh -NoProfile -File scripts/package.ps1 -Platform ${{ matrix.platform }} -Configuration release -RequireRuntime -ReleaseMode -ReleaseVersion $env:GITHUB_REF_NAME

      - name: Verify runtime playback
        # Decodes a generated WAV with the *packaged* playback core and waits for
        # real duration/position/track events, so an artifact that cannot actually
        # decode media never reaches the release page.
        #
        # -SkipLaunch skips the GUI start-up check: the runner is headless, and the
        # Slint window needs an OpenGL context that a runner without a GPU cannot
        # create. The decode check below is the part that actually proves the
        # package works.
        shell: pwsh
        run: pwsh -NoProfile -File scripts/smoke-package.ps1 -Platform ${{ matrix.platform }} -PackageDir dist/YoYoVideo-${{ matrix.platform }} -RequireRuntime -SkipLaunch -TimeoutSeconds 60

      - name: Build NSIS installer
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          pwsh -NoProfile -File scripts/build-installer.ps1 `
            -PackageDir dist/YoYoVideo-${{ matrix.platform }} `
            -OutputPath dist/YoYoVideo-${{ matrix.platform }}-setup.exe `
            -Version $env:GITHUB_REF_NAME

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YoYoVideo-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist/YoYoVideo-${{ matrix.platform }}.zip
            dist/YoYoVideo-${{ matrix.platform }}-setup.exe

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Restore release notes
        env:
          RELEASE_NOTES: ${{ needs.prepare.outputs.release_notes }}
        shell: bash
        run: |
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "The prepare job produced no release notes." >&2
            exit 1
          fi

      - name: Build the release body
        run: |
          node scripts/create-release-body.mjs \
            --assets-dir release-assets \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --output release-body.md \
            --notes-file release-notes.md

      - name: Create or update release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          commit: ${{ github.sha }}
          name: ${{ needs.prepare.outputs.tag }}
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.tag, '-rc') || contains(needs.prepare.outputs.tag, '-beta') || contains(needs.prepare.outputs.tag, '-alpha') }}
          allowUpdates: true
          bodyFile: release-body.md
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: "release-assets/**/*.*"

      - name: Notify the docs site
        # GitHub does not start workflow runs from events its own GITHUB_TOKEN
        # created, so a release published here would otherwise never rebuild the
        # site. workflow_dispatch is the documented exception.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh workflow run docs.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f tag="$TAG"; then
            echo "::warning::Could not dispatch docs.yml for ${TAG}; run it by hand if the site is stale."
          fi
